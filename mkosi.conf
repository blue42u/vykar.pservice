# Packages the upstream vykar release binary as either a sysext (the default)
# or a portable service image: `mkosi -t sysext build` / `mkosi -t portable build`.
# Format-specific content lives in mkosi.conf.d/<format>/.

[Distribution]
# The payload is a single static binary, so there is no distribution to install.
Distribution=custom

[Output]
Format=sysext
ImageId=vykar
# ImageVersion= defaults to mkosi.version, the upstream vykar version that
# mkosi.sync downloads. Release builds override it from the tag (see CI).
# Keep the version out of the file name: sysext matches the image name against
# extension-release.<name>, and portabled derives the unit prefix from it.
Output=vykar
