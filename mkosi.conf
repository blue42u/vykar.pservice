# Packages the upstream vykar release binary as either a sysext (the default)
# or a portable service image: `mkosi -t sysext build` / `mkosi -t portable build`.
# Format-specific content lives in mkosi.conf.d/<format>/.

[Distribution]
# The payload is a single static binary, so there is no distribution to install.
Distribution=custom

[Build]
# The default tools tree (CI passes --tools-tree=default) also enables the
# package-manager and runtime profiles, which pull in dnf5, zypper, pacman,
# qemu and friends. Nothing here installs packages or boots a VM, and those
# extras break the build whenever one drops out of the tools tree distribution
# (e.g. dnf5 leaving Debian testing). `misc` is the smallest profile; an empty
# value would reset to the default rather than disable them all.
ToolsTreeProfiles=misc

[Output]
Format=sysext
ImageId=vykar
# ImageVersion= defaults to mkosi.version, the upstream vykar version that
# mkosi.sync downloads. Release builds override it from the tag (see CI).
# Keep the version out of the file name: sysext matches the image name against
# extension-release.<name>, and portabled derives the unit prefix from it.
Output=vykar

[Validation]
# Verity= defaults to auto: with mkosi.key and mkosi.crt (picked up from this
# directory) the image gets a dm-verity hash partition and a signature
# partition, which systemd-mountfsd and systemd-sysext trust once mkosi.crt is
# installed in /etc/verity.d/. Without the key, the image has no verity at all.
# mkosi.crt is committed; CI writes mkosi.key from the VERITY_KEY secret.
