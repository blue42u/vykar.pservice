name: Build

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: systemd/mkosi@v27.1

      # Releases are tagged <vykar version>-<packaging revision>, and the tag
      # becomes the image version so every release sorts newer for
      # systemd-sysupdate. Pre-releases use e.g. -alpha.1 or -rc.0.
      - name: Determine image version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(cat mkosi.version)"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            case "$TAG" in
              "$version"-?*) version="$TAG" ;;
              *) echo "::error::Tag $TAG does not match $version-<revision>"; exit 1 ;;
            esac
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Use mkosi's default tools tree rather than the runner's systemd-repart
      # and mkfs tools, which may be old or missing.
      # Asset names follow systemd.v(7), with the image type as the suffix.
      # Installed copies are renamed to .raw, since the target directory
      # (/var/lib/extensions or /var/lib/portables) already implies the type.
      - name: Build images
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir dist
          mkosi --tools-tree=default --image-version="$VERSION" -t sysext -f build
          mv mkosi.output/sysext/vykar.raw "dist/vykar_${VERSION}_${ARCH}.sysext"
          mkosi --tools-tree=default --image-version="$VERSION" -t portable -f build
          mv mkosi.output/portable/vykar.raw "dist/vykar_${VERSION}_${ARCH}.pservice"

      - uses: actions/upload-artifact@v7
        with:
          name: vykar-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # systemd-sysupdate discovers versions through this manifest.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum --binary *.sysext *.pservice > SHA256SUMS

      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.sysext
            dist/*.pservice

      # SHA256SUMS goes last so it never lists files that aren't uploaded yet.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/*.sysext dist/*.pservice
          gh release upload "$TAG" dist/SHA256SUMS
